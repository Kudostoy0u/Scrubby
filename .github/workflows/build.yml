name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: scripts/build-app.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/Scrubby.app build/Scrubby.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Scrubby
          path: build/Scrubby.zip
